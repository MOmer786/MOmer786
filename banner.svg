<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Retinal vessels resolving into systemic biomarker signal">

  <defs>
    <clipPath id="disc">
      <circle cx="150" cy="128" r="88"/>
    </clipPath>
    <linearGradient id="handoff" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#B8443C"/>
      <stop offset="55%"  stop-color="#B8443C"/>
      <stop offset="100%" stop-color="#2F8A82"/>
    </linearGradient>
  </defs>

  <!-- baseline -->
  <line x1="60" y1="212" x2="1140" y2="212" stroke="#7D8590" stroke-width="1" opacity="0.35"/>

  <!-- ── fundus ── -->
  <g clip-path="url(#disc)">
    <!-- superior temporal arcade -->
    <path d="M188 118 C 150 76, 108 70, 68 84"   fill="none" stroke="#B8443C" stroke-width="2.6" stroke-linecap="round" opacity="0.9"/>
    <path d="M150 92  C 128 74, 104 68, 82 68"   fill="none" stroke="#B8443C" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
    <!-- inferior temporal arcade -->
    <path d="M188 138 C 150 182, 108 190, 66 178" fill="none" stroke="#B8443C" stroke-width="2.6" stroke-linecap="round" opacity="0.9"/>
    <path d="M152 166 C 130 184, 106 192, 84 194" fill="none" stroke="#B8443C" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
    <!-- nasal branches -->
    <path d="M196 112 C 216 90, 234 82, 250 80"   fill="none" stroke="#B8443C" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>
    <path d="M196 146 C 218 168, 236 178, 252 182" fill="none" stroke="#B8443C" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>
    <!-- macula -->
    <circle cx="92" cy="132" r="19" fill="none" stroke="#D98E2B" stroke-width="1.2" opacity="0.45"/>
  </g>

  <!-- optic disc -->
  <circle cx="192" cy="128" r="15" fill="none" stroke="#D98E2B" stroke-width="2"/>
  <!-- fundus rim -->
  <circle cx="150" cy="128" r="88" fill="none" stroke="#D98E2B" stroke-width="2.2"/>

  <!-- ── the vessel leaves the eye and becomes signal ── -->
  <path d="M207 128
           C 250 128, 268 128, 300 128
           C 330 128, 336 96, 358 96
           C 380 96, 386 156, 410 156
           C 432 156, 440 108, 462 108
           C 484 108, 492 144, 516 144
           C 540 144, 546 112, 570 112
           C 596 112, 602 134, 628 128
           C 660 121, 676 128, 706 128"
        fill="none" stroke="url(#handoff)" stroke-width="2.4" stroke-linecap="round"/>

  <!-- sampling ticks along the trace -->
  <g stroke="#7D8590" stroke-width="1" opacity="0.3">
    <line x1="358" y1="96"  x2="358" y2="212"/>
    <line x1="410" y1="156" x2="410" y2="212"/>
    <line x1="462" y1="108" x2="462" y2="212"/>
    <line x1="516" y1="144" x2="516" y2="212"/>
    <line x1="570" y1="112" x2="570" y2="212"/>
  </g>

  <!-- ── biomarker readout ── -->
  <g stroke="#2F8A82" stroke-width="6" stroke-linecap="round">
    <line x1="748"  y1="212" x2="748"  y2="150"/>
    <line x1="780"  y1="212" x2="780"  y2="108"/>
    <line x1="812"  y1="212" x2="812"  y2="168"/>
    <line x1="844"  y1="212" x2="844"  y2="86"/>
    <line x1="876"  y1="212" x2="876"  y2="132"/>
    <line x1="908"  y1="212" x2="908"  y2="176"/>
    <line x1="940"  y1="212" x2="940"  y2="100"/>
    <line x1="972"  y1="212" x2="972"  y2="158"/>
    <line x1="1004" y1="212" x2="1004" y2="120"/>
    <line x1="1036" y1="212" x2="1036" y2="182"/>
    <line x1="1068" y1="212" x2="1068" y2="140"/>
    <line x1="1100" y1="212" x2="1100" y2="164"/>
  </g>

  <!-- ── labels ── -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
     font-size="13" letter-spacing="2.5" fill="#7D8590">
    <text x="62"  y="240">FUNDUS</text>
    <text x="358" y="240">REPRESENTATION</text>
    <text x="748" y="240">SYSTEMIC BIOMARKERS</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
     font-size="12" letter-spacing="1.5" fill="#7D8590" opacity="0.75">
    <text x="62" y="46">ONE IMAGE, SIXTY SECONDS, NO NEEDLE</text>
  </g>

</svg>
